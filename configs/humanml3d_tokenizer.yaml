{
  "dataset": "humanml3d",
  "model": {
    "input_dim": 263,
    "latent_dim": 512,
    "stride": 4,
    "num_layers": 2,
    "depth": 3,
    "dropout": 0.2,
    "causal": false,
    "codebook_size": 1024,
    "semantic_codebook_size": 1024,
    "mu": 0.99,
    "quantize_dropout": true,
    "quantize_dropout_cutoff_index": 0,
    "quantize_dropout_prob": 0.2,
    "sample_codebook_temp": 0.5,
    "semantic_dim": 256,
    "semantic_supervision": true
  },
  "training": {
    "seed": 3407,
    "steps": 100000,
    "batch_size": 256,
    "lr": 0.0002,
    "betas": [
      0.9,
      0.99
    ],
    "weight_decay": 0.0,
    "warmup_steps": 2000,
    "semantic_weight": 0.15,
    "semantic_start_weight": 0,
    "semantic_warmup": 4000,
    "save_every": 1000,
    "lr_decay_at": 70000
  }
}
